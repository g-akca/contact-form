<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <title>Contact Form</title>
  </head>
  <body>
    <main>
      <h1>Contact Us</h1>

      <form novalidate>
        <div class="grid">
          <div class="input-div">
            <label for="first-name" class="main-label">First Name <span class="star-span">*</span></label>
            <input type="text" id="first-name" name="first-name" aria-describedby="first-name-error" required>
            <p id="first-name-error" class="error-text" hidden>This field is required</p>
          </div>

          <div class="input-div">
            <label for="last-name" class="main-label">Last Name <span class="star-span">*</span></label>
            <input type="text" id="last-name" name="last-name" aria-describedby="last-name-error" required>
            <p id="last-name-error" class="error-text" hidden>This field is required</p>
          </div>
        </div>

        <div class="input-div">
          <label for="email" class="main-label">Email Address <span class="star-span">*</span></label>
          <input type="email" id="email" name="email" aria-describedby="email-error" required>
          <p id="email-error" class="error-text" hidden>Please enter a valid email address</p>
        </div>

        <fieldset class="query-div">
          <legend class="main-label">Query Type <span class="star-span">*</span></legend>

          <div class="grid">
            <label for="general" class="radio-div">
              <input type="radio" id="general" name="query" aria-describedby="query-error" required>
              <span>General Enquiry</span>
            </label>

            <label for="support" class="radio-div">
              <input type="radio" id="support" name="query" aria-describedby="query-error">
              <span>Support Request</span>
            </label>
          </div>

          <p id="query-error" class="error-text" hidden>Please select a query type</p>
        </fieldset>

        <div class="textarea-div">
          <label for="message" class="main-label">Message <span class="star-span">*</span></label>
          <textarea id="message" name="message" aria-describedby="message-error" required></textarea>
          <p id="message-error" class="error-text" hidden>This field is required</p>
        </div>

        <div class="input-div">
          <div class="checkbox-div">
            <input type="checkbox" id="contact" name="contact" aria-describedby="contact-error" required>
            <label for="contact" class="main-label">I consent to being contacted by the team <span class="star-span">*</span></label>
          </div>
          <p id="contact-error" class="error-text" hidden>To submit this form, please consent to being contacted</p>
        </div>

        <button type="submit" id="submit-btn">Submit</button>
      </form>
    </main>
  </body>
</html>
