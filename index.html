<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <title>Contact Form</title>
  </head>
  <body>
    <main>
      <h1>Contact Us</h1>

      <form>
        <div class="input-div">
          <label for="first-name">First Name <span class="star-span">*</span></label>
          <input type="text" id="first-name" name="first-name" required>
        </div>

        <div class="input-div">
          <label for="last-name">Last Name <span class="star-span">*</span></label>
          <input type="text" id="last-name" name="last-name" required>
        </div>

        <div class="input-div">
          <label for="email">Email Address <span class="star-span">*</span></label>
          <input type="email" id="email" name="email" required>
        </div>

        <fieldset>
          <legend>Query Type <span class="star-span">*</span></legend>

          <div class="radio-div">
            <input type="radio" id="general" name="query">
            <label for="general">General Enquiry</label>
          </div>

          <div class="radio-div">
            <input type="radio" id="support" name="query">
            <label for="support">Support Request</label>
          </div>
        </fieldset>

        <div class="textarea-div">
          <label for="message">Message <span class="star-span">*</span></label>
          <textarea id="message" name="message"></textarea>
        </div>

        <div class="checkbox-div">
          <input type="checkbox" id="contact" name="contact">
          <label for="contact">I consent to being contacted by the team <span class="star-span">*</span></label>
        </div>

        <button type="submit" id="submit-btn">Submit</button>
      </form>
    </main>
  </body>
</html>
